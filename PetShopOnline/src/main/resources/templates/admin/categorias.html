<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head}">
    <title>Categorías - Admin</title>
</head>

<body class="admin-body">

<div class="admin-layout">

    <!-- Menú lateral -->
    <aside th:replace="~{fragmentos :: adminSidebar}"></aside>

    <!-- Contenido principal -->
    <main class="admin-main">

        <div class="admin-topbar">
            <h1 class="admin-page-title">🏷️ Gestión de Categorías</h1>
            <a th:href="@{/admin}" class="btn btn-outline-dark btn-sm">← Dashboard</a>
        </div>

        <div class="row g-4">

            <!-- Formulario alta / edición -->
            <div class="col-lg-4">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h5 th:text="${categoria.idCategoria != null} ? 'Editar Categoría' : 'Nueva Categoría'">
                            Nueva Categoría
                        </h5>
                    </div>
                    <div class="admin-card-body">
                        <form th:action="@{/admin/categorias/guardar}" method="post">

                            <!-- Campo oculto: sólo se envía si se está editando -->
                            <input type="hidden" name="idCategoria"
                                   th:if="${categoria.idCategoria != null}"
                                   th:value="${categoria.idCategoria}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre</label>
                                <input type="text"
                                       name="nombre"
                                       class="form-control"
                                       th:value="${categoria.nombre}"
                                       placeholder="Ej: Alimentos"
                                       required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Descripción</label>
                                <textarea name="descripcion"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Descripción de la categoría"
                                          th:text="${categoria.descripcion}"></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-dark w-100">
                                    <span th:text="${categoria.idCategoria != null} ? 'Actualizar' : 'Guardar'">
                                        Guardar
                                    </span>
                                </button>
                                <a th:if="${categoria.idCategoria != null}"
                                   th:href="@{/admin/categorias}"
                                   class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>

            <!-- Tabla de categorías -->
            <div class="col-lg-8">
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h5>Categorías registradas</h5>
                    </div>
                    <div class="admin-card-body p-0">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categorias}">
                                    <td th:text="${cat.idCategoria}"></td>
                                    <td th:text="${cat.nombre}"></td>
                                    <td th:text="${cat.descripcion}"></td>
                                    <td>
                                        <a th:href="@{/admin/categorias/editar/{id}(id=${cat.idCategoria})}"
                                           class="btn btn-sm btn-outline-dark me-1">
                                            Editar
                                        </a>
                                        <form th:action="@{/admin/categorias/eliminar/{id}(id=${cat.idCategoria})}"
                                              method="post" class="d-inline">
                                            <button type="submit"
                                                    class="btn btn-sm btn-outline-danger"
                                                    onclick="return confirm('¿Eliminar categoría?')">
                                                Eliminar
                                            </button>
                                        </form>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(categorias)}">
                                    <td colspan="4" class="text-center text-muted py-3">
                                        No hay categorías registradas.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
