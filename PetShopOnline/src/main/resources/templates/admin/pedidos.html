<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head}">
    <title>Pedidos - Admin</title>
</head>

<body class="admin-body">

<div class="admin-layout">

    <!-- Menú lateral -->
    <aside th:replace="~{fragmentos :: adminSidebar}"></aside>

    <!-- Contenido principal -->
    <main class="admin-main">

        <div class="admin-topbar">
            <h1 class="admin-page-title">🛒 Gestión de Pedidos</h1>
            <a th:href="@{/admin}" class="btn btn-outline-dark btn-sm">← Dashboard</a>
        </div>

        <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <div class="admin-card">
            <div class="admin-card-header">
                <h5>Pedidos registrados</h5>
            </div>
            <div class="admin-card-body p-0">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Cambiar estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pedido : ${pedidos}">
                            <td th:text="${pedido.idPedido}"></td>
                            <td th:text="${pedido.usuario.nombre}"></td>
                            <td th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                            <td th:text="'$' + ${#numbers.formatDecimal(pedido.total, 1, 2)}"></td>
                            <td>
                                <span th:if="${pedido.estado == 'PENDIENTE'}" class="badge bg-warning text-dark">Pendiente</span>
                                <span th:if="${pedido.estado == 'ENVIADO'}" class="badge bg-info text-dark">Enviado</span>
                                <span th:if="${pedido.estado == 'ENTREGADO'}" class="badge bg-success">Entregado</span>
                            </td>
                            <td>
                                <form th:action="@{/admin/pedidos/estado}" method="post" class="d-flex gap-2">
                                    <input type="hidden" name="idPedido" th:value="${pedido.idPedido}">
                                    <select name="estado" class="form-select form-select-sm" style="width: auto;">
                                        <option value="PENDIENTE" th:selected="${pedido.estado == 'PENDIENTE'}">Pendiente</option>
                                        <option value="ENVIADO" th:selected="${pedido.estado == 'ENVIADO'}">Enviado</option>
                                        <option value="ENTREGADO" th:selected="${pedido.estado == 'ENTREGADO'}">Entregado</option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-dark">Guardar</button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(pedidos)}">
                            <td colspan="6" class="text-center text-muted py-3">
                                No hay pedidos registrados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
