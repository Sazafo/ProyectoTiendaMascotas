<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: head}">
    <title>Productos - Admin</title>
</head>

<body class="admin-body">

<div class="admin-layout">

    <aside th:replace="~{fragmentos :: adminSidebar}"></aside>

    <main class="admin-main">

        <div class="admin-topbar">

            <h1 class="admin-page-title">
                📦 Gestión de Productos
            </h1>

            <a th:href="@{/admin}"
               class="btn btn-outline-dark btn-sm">
                ← Dashboard
            </a>

        </div>


        <div class="row g-4">

            <!-- =====================================================
                 FORMULARIO
                 ===================================================== -->

            <div class="col-lg-4">

                <div class="admin-card">

                    <div class="admin-card-header">

                        <h5 th:text="${producto.idProducto != null}
                            ? 'Editar Producto'
                            : 'Nuevo Producto'">

                            Nuevo Producto

                        </h5>

                    </div>


                    <div class="admin-card-body">

                        <form th:action="@{/admin/productos/guardar}"
                              method="post">


                            <input type="hidden"
                                   name="idProducto"
                                   th:if="${producto.idProducto != null}"
                                   th:value="${producto.idProducto}">


                            <!-- NOMBRE -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Nombre
                                </label>

                                <input type="text"
                                       name="nombre"
                                       class="form-control"
                                       th:value="${producto.nombre}"
                                       placeholder="Nombre del producto"
                                       required>

                            </div>


                            <!-- DESCRIPCIÓN -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Descripción
                                </label>

                                <textarea name="descripcion"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Descripción del producto"
                                          th:text="${producto.descripcion}">
                                </textarea>

                            </div>


                            <!-- PRECIO -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Precio ($)
                                </label>

                                <input type="number"
                                       name="precio"
                                       class="form-control"
                                       step="0.01"
                                       min="0"
                                       th:value="${producto.precio}"
                                       placeholder="0.00"
                                       required>

                            </div>


                            <!-- STOCK -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Stock disponible
                                </label>

                                <input type="number"
                                       name="stock"
                                       class="form-control"
                                       min="0"
                                       step="1"
                                       th:value="${producto.stock != null ? producto.stock : 0}"
                                       placeholder="0"
                                       required>

                                <div class="form-text">
                                    Cantidad disponible en inventario.
                                </div>

                            </div>


                            <!-- IMAGEN -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    URL de imagen
                                </label>

                                <input type="text"
                                       name="imagen"
                                       class="form-control"
                                       th:value="${producto.imagen}"
                                       placeholder="https://...">

                            </div>


                            <!-- CATEGORÍA -->

                            <div class="mb-3">

                                <label class="form-label fw-semibold">
                                    Categoría
                                </label>

                                <select name="idCategoria"
                                        class="form-select">

                                    <option value="">
                                        — Sin categoría —
                                    </option>

                                    <option th:each="cat : ${categorias}"
                                            th:value="${cat.idCategoria}"
                                            th:text="${cat.nombre}"
                                            th:selected="${producto.idCategoria != null
                                                and producto.idCategoria == cat.idCategoria}">
                                    </option>

                                </select>

                            </div>


                            <!-- BOTONES -->

                            <div class="d-flex gap-2">

                                <button type="submit"
                                        class="btn btn-dark w-100">

                                    <span th:text="${producto.idProducto != null}
                                        ? 'Actualizar'
                                        : 'Guardar'">

                                        Guardar

                                    </span>

                                </button>


                                <a th:if="${producto.idProducto != null}"
                                   th:href="@{/admin/productos}"
                                   class="btn btn-outline-secondary">

                                    Cancelar

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>


            <!-- =====================================================
                 TABLA DE PRODUCTOS
                 ===================================================== -->

            <div class="col-lg-8">

                <div class="admin-card">

                    <div class="admin-card-header">

                        <h5>
                            Productos registrados
                        </h5>

                    </div>


                    <div class="admin-card-body p-0">

                        <div class="table-responsive">

                            <table class="table table-hover align-middle mb-0">

                                <thead class="table-light">

                                <tr>

                                    <th>#</th>

                                    <th>Imagen</th>

                                    <th>Nombre</th>

                                    <th>Precio</th>

                                    <th>Stock</th>

                                    <th>Categoría</th>

                                    <th>Acciones</th>

                                </tr>

                                </thead>


                                <tbody>


                                <tr th:each="prod : ${productos}">


                                    <!-- ID -->

                                    <td th:text="${prod.idProducto}">
                                    </td>


                                    <!-- IMAGEN -->

                                    <td>

                                        <img th:src="${prod.imagen}"
                                             th:alt="${prod.nombre}"
                                             class="admin-product-thumb">

                                    </td>


                                    <!-- NOMBRE -->

                                    <td>

                                        <strong th:text="${prod.nombre}">
                                            Producto
                                        </strong>

                                    </td>


                                    <!-- PRECIO -->

                                    <td th:text="'$' + ${#numbers.formatDecimal(prod.precio, 1, 2)}">
                                        $0.00
                                    </td>


                                    <!-- STOCK -->

                                    <td>

                                        <!-- Stock suficiente -->

                                        <span th:if="${prod.stock != null and prod.stock > 5}"
                                              class="badge bg-success"
                                              th:text="${prod.stock}">
                                            20
                                        </span>


                                        <!-- Stock bajo -->

                                        <span th:if="${prod.stock != null
                                                and prod.stock > 0
                                                and prod.stock <= 5}"
                                              class="badge bg-warning text-dark"
                                              th:text="${prod.stock}">
                                            5
                                        </span>


                                        <!-- Sin stock -->

                                        <span th:if="${prod.stock == null or prod.stock == 0}"
                                              class="badge bg-danger">

                                            Agotado

                                        </span>

                                    </td>


                                    <!-- CATEGORÍA -->

                                    <td>

                                        <span th:each="cat : ${categorias}"
                                              th:if="${prod.idCategoria != null
                                                and prod.idCategoria == cat.idCategoria}"
                                              th:text="${cat.nombre}"
                                              class="badge bg-secondary">
                                        </span>


                                        <span th:if="${prod.idCategoria == null}"
                                              class="text-muted">

                                            —

                                        </span>

                                    </td>


                                    <!-- ACCIONES -->

                                    <td>

                                        <div class="d-flex gap-1">


                                            <a th:href="@{/admin/productos/editar/{id}
                                                (id=${prod.idProducto})}"
                                               class="btn btn-sm btn-outline-dark">

                                                Editar

                                            </a>


                                            <form th:action="@{/admin/productos/eliminar/{id}
                                                (id=${prod.idProducto})}"
                                                  method="post">


                                                <button type="submit"
                                                        class="btn btn-sm btn-outline-danger"
                                                        onclick="return confirm('¿Eliminar producto?')">

                                                    Eliminar

                                                </button>

                                            </form>

                                        </div>

                                    </td>

                                </tr>


                                <!-- VACÍO -->

                                <tr th:if="${#lists.isEmpty(productos)}">

                                    <td colspan="7"
                                        class="text-center text-muted py-4">

                                        No hay productos registrados.

                                    </td>

                                </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
