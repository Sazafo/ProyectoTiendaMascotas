<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head}"></head>

<body>

<header th:replace="~{fragmentos :: header}"></header>

<main class="container py-5">

    <div th:if="${compraExitosa}" class="card shadow">
        <div class="card-header bg-success text-white text-center">
            <h3>¡Compra realizada!</h3>
        </div>
        <div class="card-body text-center">
            <p class="fs-5">
                Gracias, <span th:text="${usuario.nombre}"></span>.
                Tu pedido
                <strong>#<span th:text="${pedido.idPedido}"></span></strong>
                fue confirmado.
            </p>
            <p>
                Total pagado:
                <strong th:text="'$' + ${#numbers.formatDecimal(pedido.total, 1, 2)}"></strong>
            </p>
            <p>
                Se enviará a:
                <span th:text="${pedido.direccionEnvio}"></span>
            </p>
            <a th:href="@{/}" class="btn btn-dark mt-3">
                Volver al inicio
            </a>
        </div>
    </div>

    <div th:unless="${compraExitosa}">

        <h2 class="subtitulo-seccion mb-4">
            Finalizar compra
        </h2>

        <div class="row">

            <div class="col-md-7">

                <form th:action="@{/checkout}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Dirección de envío</label>
                        <textarea name="direccion"
                                  class="form-control"
                                  rows="3"
                                  required
                                  placeholder="Calle, número, ciudad, provincia..."></textarea>
                    </div>

                    <div class="mb-3">

                        <label class="form-label d-block">Método de pago</label>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="metodoPago"
                                   id="pagoTarjeta"
                                   value="TARJETA"
                                   checked
                                   onclick="mostrarCampoTarjeta()">
                            <label class="form-check-label" for="pagoTarjeta">
                                Tarjeta
                            </label>
                        </div>

                        <div class="form-check form-check-inline">
                            <input class="form-check-input"
                                   type="radio"
                                   name="metodoPago"
                                   id="pagoSinpe"
                                   value="SINPE"
                                   onclick="mostrarCampoTarjeta()">
                            <label class="form-check-label" for="pagoSinpe">
                                SINPE Móvil
                            </label>
                        </div>

                    </div>

                    <div class="mb-3" id="campoTarjeta">
                        <label class="form-label">Número de tarjeta</label>
                        <input type="text"
                               name="numeroTarjeta"
                               class="form-control"
                               maxlength="19"
                               placeholder="0000 0000 0000 0000">
                    </div>

                    <div class="mb-3 alert alert-info d-none" id="campoSinpe">
                        Realiza el pago por SINPE Móvil al número
                        <strong>7286-2819</strong> y confirma tu pedido.
                    </div>

                    <button type="submit" class="btn btn-dark btn-lg w-100">
                        Confirmar pedido
                    </button>

                </form>

            </div>

            <div class="col-md-5">

                <div class="resumen-carrito">

                    <table class="table">
                        <tbody>
                            <tr th:each="item : ${carrito.items}">
                                <td th:text="${item.producto.nombre}"></td>
                                <td th:text="${item.cantidad}"></td>
                                <td th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"></td>
                            </tr>
                        </tbody>
                    </table>

                    <p class="fs-5 text-end">
                        Total:
                        <strong th:text="'$' + ${#numbers.formatDecimal(carrito.total, 1, 2)}"></strong>
                    </p>

                </div>

            </div>

        </div>

    </div>

</main>

<footer th:replace="~{fragmentos :: footer}"></footer>

<script>
    function mostrarCampoTarjeta() {

        var esTarjeta = document.getElementById('pagoTarjeta').checked;

        document.getElementById('campoTarjeta').classList.toggle('d-none', !esTarjeta);
        document.getElementById('campoSinpe').classList.toggle('d-none', esTarjeta);
    }
</script>

</body>
</html>
