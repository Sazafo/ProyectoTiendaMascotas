<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña - PetShop</title>
    <link rel="stylesheet" th:href="@{/css/usuario.css}">
</head>

<body>

<div class="barra-superior">

    <h2>PetShop Online</h2>

    <div>
        <a th:href="@{/perfil}">Mi Perfil</a>
        <a th:href="@{/logout}">Cerrar sesión</a>
    </div>

</div>

<div class="contenedor-formulario">

    <h2 class="titulo-usuario">
        Cambiar Contraseña
    </h2>

    <p class="subtitulo">
        Actualice la contraseña de su cuenta
    </p>

    <div class="mensaje"
         th:if="${mensaje}"
         th:text="${mensaje}">
    </div>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/cuenta/cambiar-password}"
          method="post">

        <div class="grupo-formulario">

            <label>
                Contraseña actual
            </label>

            <input type="password"
                   name="passwordActual"
                   required>

        </div>

        <div class="grupo-formulario">

            <label>
                Nueva contraseña
            </label>

            <input type="password"
                   name="passwordNueva"
                   required>

        </div>

        <div class="grupo-formulario">

            <label>
                Confirmar nueva contraseña
            </label>

            <input type="password"
                   name="confirmarPassword"
                   required>

        </div>

        <div class="acciones">

            <button type="submit"
                    class="btn-principal">
                Cambiar contraseña
            </button>

            <a th:href="@{/perfil}"
               class="btn-secundario">
                Cancelar
            </a>

        </div>

    </form>

</div>

<div class="pie">
    PetShop Online
</div>

</body>
</html>
