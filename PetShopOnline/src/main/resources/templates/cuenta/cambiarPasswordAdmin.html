<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña de Usuario - PetShop</title>
    <link rel="stylesheet" th:href="@{/css/usuario.css}">
</head>

<body>

<div class="barra-superior">

    <h2>PetShop Online</h2>

    <div>
        <a th:href="@{/admin/usuarios}">Gestión de usuarios</a>
        <a th:href="@{/logout}">Cerrar sesión</a>
    </div>

</div>

<div class="contenedor-formulario">

    <h2 class="titulo-usuario">
        Cambiar Contraseña
    </h2>

    <p class="subtitulo">
        Cambio de contraseña realizado por administrador
    </p>

    <div class="mensaje"
         th:if="${mensaje}"
         th:text="${mensaje}">
    </div>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <div th:if="${usuario != null}">

        <div class="datos-perfil">

            <p>
                <strong>Usuario:</strong>
                <span th:text="${usuario.nombre}"></span>
            </p>

            <p>
                <strong>Correo:</strong>
                <span th:text="${usuario.correo}"></span>
            </p>

        </div>

        <form th:action="@{/admin/cambiar-password}"
              method="post">

            <input type="hidden"
                   name="idUsuario"
                   th:value="${usuario.idUsuario}">

            <div class="grupo-formulario">

                <label>
                    Nueva contraseña
                </label>

                <input type="password"
                       name="passwordNueva"
                       required>

            </div>

            <div class="grupo-formulario">

                <label>
                    Confirmar contraseña
                </label>

                <input type="password"
                       name="confirmarPassword"
                       required>

            </div>

            <div class="acciones">

                <button type="submit"
                        class="btn-principal">
                    Cambiar contraseña
                </button>

                <a th:href="@{/admin/usuarios}"
                   class="btn-secundario">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

    <div th:if="${usuario == null}"
         class="error">

        No se encontró el usuario seleccionado.

    </div>

</div>

<div class="pie">
    PetShop Online
</div>

</body>
</html>
