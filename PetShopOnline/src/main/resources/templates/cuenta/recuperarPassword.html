<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - PetShop</title>
    <link rel="stylesheet" th:href="@{/css/usuario.css}">
</head>

<body>

<div class="barra-superior">

    <h2>PetShop Online</h2>

    <div>
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/login}">Iniciar sesión</a>
    </div>

</div>

<div class="contenedor-formulario">

    <h2 class="titulo-usuario">
        Recuperar Contraseña
    </h2>

    <p class="subtitulo">
        Ingrese su correo y establezca una nueva contraseña
    </p>

    <div class="mensaje"
         th:if="${mensaje}"
         th:text="${mensaje}">
    </div>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/recuperar-password}"
          method="post">

        <div class="grupo-formulario">

            <label>
                Correo electrónico
            </label>

            <input type="email"
                   name="correo"
                   required>

        </div>

        <div class="grupo-formulario">

            <label>
                Nueva contraseña
            </label>

            <input type="password"
                   name="passwordNueva"
                   required>

        </div>

        <div class="grupo-formulario">

            <label>
                Confirmar contraseña
            </label>

            <input type="password"
                   name="confirmarPassword"
                   required>

        </div>

        <div class="acciones">

            <button type="submit"
                    class="btn-principal">
                Recuperar contraseña
            </button>

            <a th:href="@{/login}"
               class="btn-secundario">
                Volver al login
            </a>

        </div>

    </form>

</div>

<div class="pie">
    PetShop Online
</div>

</body>
</html>
