<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{fragmentos :: head}"></head>

    <body>

        <header th:replace="~{fragmentos :: header}"></header>

        <main class="container py-5">

            <!-- VOLVER -->
            <div class="mb-4">

                <a th:href="@{/productos}"
                   class="text-decoration-none text-dark">

                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Volver a productos

                </a>

            </div>


            <!-- DETALLE PRINCIPAL -->
            <section class="card border-0 shadow-sm rounded-4 overflow-hidden">

                <div class="row g-0">

                    <!-- IMAGEN -->
                    <div class="col-lg-6">

                        <div class="p-4 p-lg-5 text-center bg-light h-100
                             d-flex align-items-center justify-content-center">

                            <img th:src="${producto.imagen}"
                                 th:alt="${producto.nombre}"
                                 class="img-fluid rounded-4"
                                 style="max-height: 450px;
                                 width: 100%;
                                 object-fit: contain;">

                        </div>

                    </div>


                    <!-- INFORMACIÓN -->
                    <div class="col-lg-6">

                        <div class="p-4 p-lg-5">

                            <a th:if="${categoria != null}"
                               th:href="@{/productos(categoria=${categoria.idCategoria})}"
                               class="text-decoration-none">

                                <span class="badge text-bg-dark mb-3"
                                      th:text="${categoria.nombre}">
                                    Categoría
                                </span>

                            </a>


                            <h1 class="fw-bold mb-3"
                                th:text="${producto.nombre}">

                                Producto

                            </h1>


                            <p class="text-muted fs-5 mb-4"
                               th:text="${producto.descripcion}">

                                Descripción

                            </p>


                            <hr>


                            <!-- PRECIO -->
                            <div class="my-4">

                                <p class="text-muted mb-1">
                                    Precio
                                </p>

                                <h2 class="fw-bold"
                                    th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">

                                    $0.00

                                </h2>

                            </div>


                            <!-- CARRITO -->
                            <form th:action="@{/carrito/agregar}"
                                  method="post">

                                <input type="hidden"
                                       name="idProducto"
                                       th:value="${producto.idProducto}">


                                <div class="mb-4">

                                    <label for="cantidad"
                                           class="form-label fw-semibold">

                                        Cantidad

                                    </label>

                                    <input type="number"
                                           id="cantidad"
                                           name="cantidad"
                                           value="1"
                                           min="1"
                                           class="form-control form-control-lg"
                                           style="max-width: 130px;">

                                </div>


                                <button type="submit"
                                        class="btn btn-dark btn-lg w-100">

                                    <i class="fa-solid fa-cart-shopping me-2"></i>
                                    Agregar al carrito

                                </button>

                            </form>


                            <!-- INFO EXTRA -->
                            <div class="row mt-4 g-3">

                                <div class="col-6">

                                    <div class="border rounded-3 p-3 text-center h-100">

                                        <i class="fa-solid fa-truck mb-2"></i>

                                        <p class="small mb-0">
                                            Entrega rápida
                                        </p>

                                    </div>

                                </div>


                                <div class="col-6">

                                    <div class="border rounded-3 p-3 text-center h-100">

                                        <i class="fa-solid fa-paw mb-2"></i>

                                        <p class="small mb-0">
                                            Pensado para tu mascota
                                        </p>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </section>


            <!-- PRODUCTOS RELACIONADOS -->
            <section class="mt-5"
                     th:if="${relacionados != null and !#lists.isEmpty(relacionados)}">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div>

                        <h2 class="fw-bold mb-1">
                            También te puede interesar
                        </h2>

                        <p class="text-muted mb-0">
                            Otros productos similares para tu mascota.
                        </p>

                    </div>

                    <a th:href="@{/productos(categoria=${producto.idCategoria})}"
                       class="btn btn-outline-dark">

                        Ver categoría

                    </a>

                </div>


                <div class="row g-4">

                    <div class="col-sm-6 col-md-4 col-lg-3"
                         th:each="relacionado : ${relacionados}">

                        <div class="card producto-card h-100 border-0 shadow-sm">


                            <!-- IMAGEN -->
                            <a th:href="@{/productos/detalle/{id}(id=${relacionado.idProducto})}">

                                <img th:src="${relacionado.imagen}"
                                     th:alt="${relacionado.nombre}"
                                     class="card-img-top producto-img">

                            </a>


                            <div class="card-body d-flex flex-column">


                                <h5 class="fw-bold"
                                    th:text="${relacionado.nombre}">

                                    Producto

                                </h5>


                                <p class="text-muted"
                                   th:text="${relacionado.descripcion}">

                                    Descripción

                                </p>


                                <p class="precio mt-auto"
                                   th:text="'$' + ${#numbers.formatDecimal(relacionado.precio, 1, 2)}">

                                    $0.00

                                </p>


                                <a th:href="@{/productos/detalle/{id}(id=${relacionado.idProducto})}"
                                   class="btn btn-outline-dark w-100">

                                    <i class="fa-solid fa-eye me-2"></i>
                                    Ver producto

                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </section>


            <!-- CONTINUAR EXPLORANDO -->
            <div class="text-center mt-5">

                <p class="text-muted mb-3">
                    ¿Quieres seguir explorando?
                </p>

                <a th:href="@{/productos}"
                   class="btn btn-dark">

                    Ver todos los productos

                </a>

            </div>

        </main>


        <footer th:replace="~{fragmentos :: footer}"></footer>

    </body>
</html>
