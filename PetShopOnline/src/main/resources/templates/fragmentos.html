<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<head th:fragment="head">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PetShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/estilos.css}">

</head>


<header th:fragment="header">

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">

        <div class="container">

            <a class="navbar-brand fw-bold fs-4"
               th:href="@{/}">
                PetShop
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                 id="menuPrincipal">

                <ul class="navbar-nav mx-auto gap-lg-4">

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/productos}">
                            Productos
                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/productos}">
                            Categorías
                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="#">
                            Precios
                        </a>

                    </li>

                </ul>

                <div class="d-flex align-items-center gap-3">

                    <a th:if="${session.usuarioSesion == null}"
                       th:href="@{/login}"
                       class="text-decoration-none text-dark">
                        Iniciar sesión
                    </a>

                    <a th:if="${session.usuarioSesion != null and session.usuarioSesion.rol == 'ADMIN'}"
                       th:href="@{/admin}"
                       class="text-decoration-none text-success fw-semibold">

                        <i class="fa-solid fa-gauge-high me-1"></i>
                        Panel Admin

                    </a>

                    <a th:if="${session.usuarioSesion != null}"
                       th:href="@{/perfil}"
                       class="text-decoration-none text-dark">

                        <i class="fa-solid fa-user me-1"></i>

                        <span th:text="${session.usuarioSesion.nombre}">
                            Mi perfil
                        </span>

                    </a>

                    <a th:if="${session.usuarioSesion != null}"
                       th:href="@{/logout}"
                       class="text-decoration-none text-danger">
                        Cerrar sesión
                    </a>

                    <a th:href="@{/carrito}"
                       class="text-decoration-none text-dark fs-5">

                        <i class="fa-solid fa-cart-shopping"></i>

                    </a>

                </div>

            </div>

        </div>

    </nav>

</header>


<aside th:fragment="adminSidebar"
       class="bg-dark text-white min-vh-100 p-4"
       style="width: 250px;">

    <h4 class="mb-4">
        <i class="fa-solid fa-paw me-2"></i>
        Administración
    </h4>

    <ul class="nav flex-column gap-2">

        <li class="nav-item">

            <a th:href="@{/}"
               class="nav-link text-white">

                <i class="fa-solid fa-house me-2"></i>
                Inicio

            </a>

        </li>

        <li class="nav-item">

            <a th:href="@{/admin}"
               class="nav-link text-white">

                <i class="fa-solid fa-gauge-high me-2"></i>
                Dashboard

            </a>

        </li>

        <li class="nav-item">

            <a th:href="@{/admin/usuarios}"
               class="nav-link text-white">

                <i class="fa-solid fa-users me-2"></i>
                Usuarios

            </a>

        </li>

        <li class="nav-item">

            <a th:href="@{/admin/pedidos}"
               class="nav-link text-white">

                <i class="fa-solid fa-cart-shopping me-2"></i>
                Pedidos

            </a>

        </li>

        <li class="nav-item">

            <a th:href="@{/productos}"
               class="nav-link text-white">

                <i class="fa-solid fa-box me-2"></i>
                Productos

            </a>

        </li>

        <li class="nav-item">

            <a th:href="@{/admin/reportes}"
               class="nav-link text-white">

                <i class="fa-solid fa-chart-bar me-2"></i>
                Reportes

            </a>

        </li>

        <li class="nav-item">

            <a th:href="@{/perfil}"
               class="nav-link text-white">

                <i class="fa-solid fa-user me-2"></i>
                Mi Perfil

            </a>

        </li>

        <li class="nav-item mt-3">

            <a th:href="@{/logout}"
               class="nav-link text-warning">

                <i class="fa-solid fa-right-from-bracket me-2"></i>
                Cerrar sesión

            </a>

        </li>

    </ul>

</aside>


<footer th:fragment="footer"
        class="bg-dark text-white text-center py-4 mt-5">

    <p class="mb-0">
        © 2026 PetShop Online
    </p>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

</footer>

</body>

</html>
