<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi Perfil - PetShop</title>

    <link rel="stylesheet"
          th:href="@{/css/usuario.css}">
</head>

<body>

<div class="barra-superior">

    <h2>PetShop Online</h2>

    <div>

        <a th:href="@{/}">
            Inicio
        </a>

        <a th:if="${session.usuarioSesion != null and session.usuarioSesion.rol == 'ADMIN'}"
           th:href="@{/admin}">
            Panel Admin
        </a>

        <a th:href="@{/logout}">
            Cerrar sesión
        </a>

    </div>

</div>


<div class="contenedor-formulario">

    <h2 class="titulo-usuario">
        Mi Perfil
    </h2>

    <p class="subtitulo">
        Información de la cuenta
    </p>


    <div class="datos-perfil">

        <p>
            <strong>Nombre:</strong>
            <span th:text="${usuario.nombre}"></span>
        </p>

        <p>
            <strong>Correo:</strong>
            <span th:text="${usuario.correo}"></span>
        </p>

        <p>
            <strong>Rol:</strong>
            <span th:text="${usuario.rol}"></span>
        </p>

        <p>
            <strong>Estado:</strong>

            <span th:if="${usuario.activo}"
                  class="estado-activo">
                Activo
            </span>

            <span th:unless="${usuario.activo}"
                  class="estado-inactivo">
                Inactivo
            </span>

        </p>

    </div>


    <div class="acciones">

        <a th:href="@{/cuenta/cambiar-password}"
           class="btn-principal">
            Cambiar contraseña
        </a>

        <a th:if="${session.usuarioSesion != null and session.usuarioSesion.rol == 'ADMIN'}"
           th:href="@{/admin}"
           class="btn-principal">
            Panel de Administración
        </a>

        <a th:if="${session.usuarioSesion != null and session.usuarioSesion.rol == 'ADMIN'}"
           th:href="@{/admin/usuarios}"
           class="btn-principal">
            Gestión de usuarios
        </a>

        <a th:href="@{/}"
           class="btn-secundario">
            Volver al inicio
        </a>

    </div>

</div>


<div class="pie">
    PetShop Online
</div>

</body>

</html>
