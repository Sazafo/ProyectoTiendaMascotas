<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: head}"></head>

<body>

<header th:replace="~{fragmentos :: header}"></header>

<main class="container py-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            Precios
        </h1>

        <p class="text-muted fs-5">
            Consulta nuestros productos ordenados de menor a mayor precio.
        </p>

    </div>


    <div class="row g-4">

        <div class="col-sm-6 col-md-4 col-lg-3"
             th:each="producto : ${productos}">

            <div class="card producto-card h-100 border-0 shadow-sm">

                <a th:href="@{/productos/detalle/{id}(id=${producto.idProducto})}">

                    <img th:src="${producto.imagen}"
                         th:alt="${producto.nombre}"
                         class="card-img-top producto-img">

                </a>


                <div class="card-body d-flex flex-column">

                    <h5 class="fw-bold"
                        th:text="${producto.nombre}">
                        Producto
                    </h5>

                    <p class="text-muted"
                       th:text="${producto.descripcion}">
                        Descripción
                    </p>

                    <div class="mt-auto">

                        <p class="text-muted mb-1">
                            Precio
                        </p>

                        <p class="precio mb-3"
                           th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">
                            $0.00
                        </p>

                        <a th:href="@{/productos/detalle/{id}(id=${producto.idProducto})}"
                           class="btn btn-outline-dark w-100">

                            <i class="fa-solid fa-eye me-2"></i>
                            Ver detalle

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <div th:if="${#lists.isEmpty(productos)}"
         class="text-center py-5">

        <i class="fa-solid fa-tag fa-3x text-muted mb-3"></i>

        <h4>
            No hay productos disponibles
        </h4>

        <p class="text-muted">
            Aún no existen productos para mostrar.
        </p>

    </div>

</main>

<footer th:replace="~{fragmentos :: footer}"></footer>

</body>
</html>
