<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: head}"></head>

<body>

<header th:replace="~{fragmentos :: header}"></header>

<main class="container py-5">

    <!-- TÍTULO -->
    <div class="text-center mb-4">

        <h1 class="fw-bold">
            Nuestros productos
        </h1>

        <p class="text-muted fs-5">
            Encuentra lo mejor para el cuidado y bienestar de tu mascota.
        </p>

    </div>


    <!-- FILTROS -->
    <div class="d-flex flex-wrap justify-content-center gap-2 mb-5">

        <a th:href="@{/productos}"
           class="btn"
           th:classappend="${categoriaActual == null} ? 'btn-dark' : 'btn-outline-dark'">

            Todos

        </a>


        <a th:href="@{/productos(categoria=1)}"
           class="btn"
           th:classappend="${categoriaActual == 1} ? 'btn-dark' : 'btn-outline-dark'">

            Alimentos

        </a>


        <a th:href="@{/productos(categoria=2)}"
           class="btn"
           th:classappend="${categoriaActual == 2} ? 'btn-dark' : 'btn-outline-dark'">

            Accesorios

        </a>


        <a th:href="@{/productos(categoria=3)}"
           class="btn"
           th:classappend="${categoriaActual == 3} ? 'btn-dark' : 'btn-outline-dark'">

            Higiene

        </a>

    </div>


    <!-- PRODUCTOS -->
    <div class="row g-4">

        <div class="col-sm-6 col-md-4 col-lg-3"
             th:each="producto : ${productos}">

            <div class="card producto-card h-100 border-0 shadow-sm">


                <!-- IMAGEN -->
                <a th:href="@{/productos/detalle/{id}(id=${producto.idProducto})}">

                    <img th:src="${producto.imagen}"
                         th:alt="${producto.nombre}"
                         class="card-img-top producto-img">

                </a>


                <div class="card-body d-flex flex-column">


                    <!-- NOMBRE -->
                    <h5 class="card-title fw-bold"
                        th:text="${producto.nombre}">

                        Producto

                    </h5>


                    <!-- DESCRIPCIÓN -->
                    <p class="card-text text-muted"
                       th:text="${producto.descripcion}">

                        Descripción

                    </p>


                    <!-- PRECIO -->
                    <p class="precio mt-auto"
                       th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 2)}">

                        $0.00

                    </p>


                    <!-- VER DETALLE -->
                    <a th:href="@{/productos/detalle/{id}(id=${producto.idProducto})}"
                       class="btn btn-outline-dark w-100 mb-2">

                        <i class="fa-solid fa-eye me-2"></i>
                        Ver detalle

                    </a>


                    <!-- CARRITO -->
                    <form th:action="@{/carrito/agregar}"
                          method="post">

                        <input type="hidden"
                               name="idProducto"
                               th:value="${producto.idProducto}">

                        <input type="hidden"
                               name="cantidad"
                               value="1">

                        <button type="submit"
                                class="btn btn-dark w-100">

                            <i class="fa-solid fa-cart-shopping me-2"></i>
                            Agregar al carrito

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- SI EL FILTRO NO ENCUENTRA PRODUCTOS -->
    <div th:if="${#lists.isEmpty(productos)}"
         class="text-center py-5">

        <i class="fa-solid fa-paw fa-3x text-muted mb-3"></i>

        <h4>
            No hay productos en esta categoría
        </h4>

        <p class="text-muted">
            Prueba seleccionando otra categoría.
        </p>

        <a th:href="@{/productos}"
           class="btn btn-outline-dark mt-2">

            Ver todos los productos

        </a>

    </div>

</main>


<footer th:replace="~{fragmentos :: footer}"></footer>

</body>
</html>
