<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<div class="contenedor-formulario">

    <h2>Crear cuenta</h2>

    <form th:action="@{/registro}" method="post">

        <div class="grupo-formulario">
            <label>Nombre</label>
            <input type="text"
                   name="nombre"
                   required>
        </div>

        <div class="grupo-formulario">
            <label>Correo electrónico</label>
            <input type="email"
                   name="correo"
                   required>
        </div>

        <div class="grupo-formulario">
            <label>Contraseña</label>
            <input type="password"
                   name="password"
                   required>
        </div>

        <button type="submit">
            Registrarse
        </button>

    </form>

    <p>
        ¿Ya tienes una cuenta?
        <a th:href="@{/login}">Iniciar sesión</a>
    </p>

</div>

</body>
</html>
