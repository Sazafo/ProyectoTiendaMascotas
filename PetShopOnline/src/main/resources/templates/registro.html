<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - PetShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-header bg-success text-white text-center">
                    <h3 class="mb-0">Crear cuenta</h3>
                </div>

                <div class="card-body p-4">

                    <form th:action="@{/registro}" method="post">

                        <div class="mb-3">
                            <label class="form-label">
                                Nombre
                            </label>

                            <input type="text"
                                   name="nombre"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Correo electrónico
                            </label>

                            <input type="email"
                                   name="correo"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Contraseña
                            </label>

                            <input type="password"
                                   name="password"
                                   class="form-control"
                                   required>
                        </div>

                        <div th:if="${error}"
                             class="alert alert-danger">
                            [[${error}]]
                        </div>

                        <button type="submit"
                                class="btn btn-success w-100">
                            Registrarse
                        </button>

                    </form>

                    <hr>

                    <p class="text-center mb-0">
                        ¿Ya tienes una cuenta?

                        <a th:href="@{/login}">
                            Iniciar sesión
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
