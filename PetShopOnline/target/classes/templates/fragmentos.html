<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop Online</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold fs-3" th:href="@{/}">
                PetShop
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-4">

                    <li class="nav-item">
                        <a class="nav-link fs-5" th:href="@{/productos}">Productos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fs-5" th:href="@{/categorias}">Categorías</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fs-5" th:href="@{/precios}">Precios</a>
                    </li>

                </ul>

                <div class="d-flex gap-3">
                    <a class="nav-link fs-4" th:href="@{/login}">
                        👤
                    </a>

                    <a class="nav-link fs-4" th:href="@{/carrito}">
                        🛒
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>

<footer th:fragment="footer">
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0">&copy; 2026 PetShop Online</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
