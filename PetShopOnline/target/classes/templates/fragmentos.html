<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop Online</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold fs-3" th:href="@{/}">
                PetShop
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-4">

                    <li class="nav-item">
                        <a class="nav-link fs-5" th:href="@{/productos}">Productos</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fs-5" th:href="@{/categorias}">Categorías</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link fs-5" th:href="@{/precios}">Precios</a>
                    </li>

                </ul>

                <div class="d-flex gap-3">
                    <div th:if="${session.usuarioSesion == null}">
    <a class="nav-link fs-5" th:href="@{/login}">
        Iniciar sesión
    </a>
                </div>

                    <div class="dropdown" th:if="${session.usuarioSesion != null}">

                        <a class="nav-link dropdown-toggle fs-5"
                        href="#"
                        role="button"
                        data-bs-toggle="dropdown">

                        👤 [[${session.usuarioSesion.nombre}]]

                        </a>

            <ul class="dropdown-menu dropdown-menu-end">

                <li>
                <a class="dropdown-item" th:href="@{/perfil}">
                    Mi perfil
                </a>
            </li>

             <li>
                <a class="dropdown-item" th:href="@{/logout}">
                    Cerrar sesión
                </a>
             </li>

            </ul>

                    </div>

                    <a class="nav-link fs-4" th:href="@{/carrito}">
                        🛒
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>

<!-- Menú lateral del panel administrativo -->
<aside th:fragment="adminSidebar">
    <div class="admin-sidebar d-flex flex-column">
        <div class="admin-sidebar-brand">
            <span>🐾 Admin Panel</span>
        </div>
        <nav class="admin-nav flex-grow-1">
            <a th:href="@{/admin}"
               th:classappend="${currentUri == '/admin' or currentUri == '/admin/'} ? 'active' : ''"
               class="admin-nav-link">
                📊 Dashboard
            </a>
            <a th:href="@{/admin/productos}"
               th:classappend="${currentUri != null and currentUri.startsWith('/admin/productos')} ? 'active' : ''"
               class="admin-nav-link">
                📦 Productos
            </a>
            <a th:href="@{/admin/categorias}"
               th:classappend="${currentUri != null and currentUri.startsWith('/admin/categorias')} ? 'active' : ''"
               class="admin-nav-link">
                🏷️ Categorías
            </a>
            <hr class="admin-nav-divider">
            <a th:href="@{/}" class="admin-nav-link">
                🏠 Tienda
            </a>
            <a th:href="@{/logout}" class="admin-nav-link admin-nav-logout">
                🚪 Cerrar sesión
            </a>
        </nav>
        <div class="admin-sidebar-footer">
            <span th:text="${session.usuarioSesion?.nombre}"></span>
        </div>
    </div>
</aside>

<footer th:fragment="footer">
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <p class="mb-0">&copy; 2026 PetShop Online</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</footer>

</body>
</html>
