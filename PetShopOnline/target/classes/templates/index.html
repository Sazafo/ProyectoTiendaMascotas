<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head}"></head>

<body>

<header th:replace="~{fragmentos :: header}"></header>

<main class="container py-5">

    <section class="row align-items-center mb-5">
        <div class="col-md-5">
            <h1 class="titulo-principal">
                Todo para tu mascota, en un solo lugar!
            </h1>
            <p class="lead mt-3">
                Encuentra alimentos, accesorios y productos esenciales para consentir a tu mascota.
            </p>
            <a th:href="@{/productos}" class="btn btn-dark btn-lg mt-3">
                Ver productos
            </a>
        </div>

        <div class="col-md-7 text-center">
            <img src="https://images.unsplash.com/photo-1601758123927-196f01c5fe4a"
                 class="img-fluid imagen-principal"
                 alt="Mascotas">
        </div>
    </section>

    <section>
        <div class="d-flex justify-content-start mb-4">
            <h2 class="subtitulo-seccion">
                Productos Destacados
            </h2>
        </div>

        <div class="row g-4">

            <div class="col-md-3" th:each="producto : ${productos}">
                <div class="card producto-card h-100">
                    <img th:src="${producto.imagen}"
                         class="card-img-top producto-img"
                         th:alt="${producto.nombre}">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title" th:text="${producto.nombre}"></h5>
                        <p class="card-text" th:text="${producto.descripcion}"></p>
                        <p class="precio" th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 2)}"></p>

                        <form th:action="@{/carrito/agregar}" method="post" class="mt-auto">
                            <input type="hidden" name="idProducto" th:value="${producto.idProducto}">
                            <input type="hidden" name="cantidad" value="1">
                            <button type="submit" class="btn btn-dark w-100">
                                Agregar al carrito
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </section>

</main>

<footer th:replace="~{fragmentos :: footer}"></footer>

</body>
</html>
